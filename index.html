  }

  let anim = null;
  function startMoveAnimation(face, prime) {
    const f = FACES[face];
    const pivot = new THREE.Object3D();
    cubeGroup.add(pivot);
    for (const c of cubies) if (Math.round(c.position[f.axis]) === f.layer) pivot.attach(c);
    anim = { pivot, axis: f.n, angle: turnAngle(prime), start: performance.now(), dur: 320 };
  }

  function finishMoveAnimation() {
    const { pivot } = anim;
    pivot.quaternion.setFromAxisAngle(anim.axis, anim.angle);
    pivot.updateMatrixWorld(true);
    for (const c of [...pivot.children]) { cubeGroup.attach(c); snapCubie(c); }
    cubeGroup.remove(pivot);
    anim = null;
    refreshLayer(); // a highlighted layer now contains different pieces
    sync();
  }

  // ---------- Win detection ----------
  const LINES = [
    [[0,0],[0,1],[0,2]], [[1,0],[1,1],[1,2]], [[2,0],[2,1],[2,2]],
    [[0,0],[1,0],[2,0]], [[0,1],[1,1],[2,1]], [[0,2],[1,2],[2,2]],
    [[0,0],[1,1],[2,2]], [[0,2],[1,1],[2,0]],
  ];

  function faceGrids() {
    const grids = {};
    const n = new THREE.Vector3();
    for (const s of stickers) {
      const cubie = s.parent;
      n.copy(s.userData.normal).applyQuaternion(cubie.quaternion);
      const axis = Math.abs(n.x) > 0.5 ? 'x' : Math.abs(n.y) > 0.5 ? 'y' : 'z';
      const key = axis + (n[axis] > 0 ? '+' : '-');
      const [a, b] = axis === 'x' ? ['y', 'z'] : axis === 'y' ? ['x', 'z'] : ['x', 'y'];
      const grid = grids[key] || (grids[key] = [[], [], []]);
      grid[Math.round(cubie.position[a]) + 1][Math.round(cubie.position[b]) + 1] = s;
    }
    return grids;
  }

  function findLines(mark) {
    const found = [];
    for (const grid of Object.values(faceGrids())) {
      for (const line of LINES) {
        const ss = line.map(([r, c]) => grid[r][c]);
        if (ss.every(s => s && s.userData.mark === mark)) found.push(ss);
      }
    }
    return found;
  }

  // ---------- Shared game document ----------
  // The whole game is one document. The cube's position is the list of moves since a solved cube,
  // so every device replays it identically. The winner is derived, never stored.
  const EMPTY_MARKS = '.'.repeat(STICKER_COUNT);
  const other = p => p === 'X' ? 'O' : 'X';

  function normalize(d) {
    d = d || {};
    const marks = typeof d.marks === 'string' && d.marks.length === STICKER_COUNT ? d.marks : EMPTY_MARKS;
    const moves = Array.isArray(d.moves) ? d.moves.filter(m => m && FACES[m.f]).map(m => ({ f: m.f, p: !!m.p, by: m.by === 'O' ? 'O' : 'X' })) : [];
    const seats = d.seats || {};
    return {
      round: Number.isFinite(d.round) ? d.round : 0,
      seats: { X: typeof seats.X === 'string' ? seats.X : null, O: typeof seats.O === 'string' ? seats.O : null },
      marks, moves,
      current: d.current === 'O' ? 'O' : 'X',
      phase: d.phase === 'move' ? 'move' : 'place',
      last: Number.isInteger(d.last) ? d.last : -1,
      ver: Number.isFinite(d.ver) ? d.ver : 0, // grows with every change; used by code play to ignore stale states
    };
  }

  let game = normalize(null);      // latest document state
  let gameExists = false;
  let applied = { round: null, moves: [] }; // what the 3D cube currently shows
  let outcome = null;               // { winner: 'X'|'O'|null, lines } once the game is over

  // Mode: 'connecting' | 'local' (one device) | 'online'
  let mode = 'connecting';
  let db = null, userApi = null, gameRef = null, myId = null, canWrite = true, amOwner = false;
  let busy = false;

  const sameMove = (a, b) => a.f === b.f && a.p === b.p;

  function sync() {
    if (anim) return; // picked up again when the animation ends
    const d = game;
    const isPrefix = applied.moves.length <= d.moves.length && applied.moves.every((m, i) => sameMove(m, d.moves[i]));
    if (d.round !== applied.round || !isPrefix || d.moves.length > applied.moves.length + 1) {
      resetCube();
      for (const m of d.moves) applyMoveInstant(m.f, m.p);
      applied = { round: d.round, moves: d.moves.slice() };
      rebuildLog();
      refreshLayer();
    } else if (d.moves.length === applied.moves.length + 1) {
      const m = d.moves[d.moves.length - 1];
      applied = { round: d.round, moves: d.moves.slice() };
      appendLog(m);
      applyMarks();
      startMoveAnimation(m.f, m.p);
      updateUI();
      return;
    }
    applyMarks();
    computeOutcome();
    if (outcome && mode === 'p2p' && net && net.kind === 'match') reportMatchResult(net.matchId, net.gameNo, outcome.winner);
    updateUI();
  }

  function applyMarks() {
    for (const s of stickers) {
      const ch = game.marks[s.userData.index];
      const mark = ch === 'X' || ch === 'O' ? ch : null;
      const last = s.userData.index === game.last && !!mark;
      if (s.userData.mark !== mark || s.userData.last !== last) {
        s.userData.mark = mark; s.userData.last = last;
        if (mark) s.userData.hover = null;
        drawSticker(s);
      }
    }
  }

  function computeOutcome() {
    let result = null;
    // Only judged right after a cube turn: while a mark waits for its turn ('move' phase) nothing counts yet.
    if (game.moves.length && game.phase === 'place') {
      const mover = game.moves[game.moves.length - 1].by;
      const moverLines = findLines(mover), otherLines = findLines(other(mover));
      if (moverLines.length) result = { winner: mover, lines: moverLines };
      else if (otherLines.length) result = { winner: other(mover), lines: otherLines };
      else if (!game.marks.includes('.')) result = { winner: null, lines: [] };
    }
    outcome = result;
    const winSet = new Set();
    if (result) for (const line of result.lines) for (const s of line) winSet.add(s);
    for (const s of stickers) {
      const w = winSet.has(s);
      if (s.userData.win !== w) { s.userData.win = w; drawSticker(s); }
    }
  }

  // ---------- Players ----------
  const isSeated = () => mode === 'online' && !!myId && (game.seats.X === myId || game.seats.O === myId);
  const mySide = () => game.seats.X === myId ? 'X' : game.seats.O === myId ? 'O' : null;

  function isMyTurn() {
    if (mode === 'local') return true;
    if (mode === 'p2p') return netReady() && game.current === net.side;
    if (mode !== 'online' || !myId || !canWrite) return false;
    return game.seats[game.current] === myId;
  }

  function canAct(phase) {
    return !anim && !busy && !outcome && game.phase === phase && isMyTurn();
  }

  let names = {}; // id -> display name, refreshed on each render
  function seatLabel(p) {
    if (mode === 'p2p') {
      if (net.kind === 'watch') return `${p === 'X' ? net.xName : net.oName} (${p})`;
      if (p === net.side) return `${t('you')} (${p})`;
      return `${net.kind === 'match' ? net.opponent : t('opponent')} (${p})`;
    }
    if (mode !== 'online') return p === 'X' ? `${t('player1')} (X)` : `${t('player2')} (O)`;
    const id = game.seats[p];
    if (id && id === myId) return `${t('you')} (${p})`;
    if (id) return `${names[id] || t(p === 'X' ? 'player1' : 'player2')} (${p})`;
    return `${t('playerOf', { p })} (${p})`;
  }

  async function refreshNames() {
    if (!userApi) return;
    const ids = [game.seats.X, game.seats.O].filter(Boolean);
    if (!ids.length) return;
    try {
      const ps = await userApi.profiles(ids);
      let changed = false;
      for (const id of ids) {
        const n = (ps[id] && ps[id].name) || '';
        if (names[id] !== n) { names[id] = n; changed = true; }
      }
      if (changed) updateUI();
    } catch (_) { /* names are optional */ }
  }

  // ---------- UI ----------
  const statusEl = document.getElementById('status');
  const movesEl = document.getElementById('moves');
  const logList = document.getElementById('logList');
  const banner = document.getElementById('banner');
  const bannerText = document.getElementById('bannerText');
  const seatsEl = document.getElementById('seats');
  const noteEl = document.getElementById('note');
  const newGameBtn = document.getElementById('newGame');

  const moveButtons = [];
  for (const f of ['U', 'D', 'L', 'R', 'F', 'B', 'M', 'E', 'S']) {
    for (const prime of [false, true]) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = f + (prime ? "'" : '');
      b.dataset.face = f;
      b.dataset.prime = prime ? '1' : '';
      if (FACES[f].slice) b.className = 'slice';
      b.addEventListener('click', () => { showLayer(null); makeMove(f, prime); });
      // Show which layer this button turns: on hover (mouse), while pressed (touch) and on keyboard focus.
      b.addEventListener('pointerenter', () => showLayer(f));
      b.addEventListener('pointerdown', () => showLayer(f));
      b.addEventListener('pointerleave', () => showLayer(null));
      b.addEventListener('pointercancel', () => showLayer(null));
      b.addEventListener('focus', () => showLayer(f));
      b.addEventListener('blur', () => showLayer(null));
      moveButtons.push(b);
    }
  }
  moveButtons.filter((_, i) => i % 2 === 0).forEach(b => movesEl.appendChild(b));
  moveButtons.filter((_, i) => i % 2 === 1).forEach(b => movesEl.appendChild(b));
  const hint = document.createElement('div');
  hint.className = 'hint';
  movesEl.appendChild(hint);
  function labelMoveButtons() {
    for (const b of moveButtons) {
      const f = b.dataset.face;
      const what = FACES[f].slice ? t('slice' + f) : t('faceWhat', { f });
      b.title = t('turnTitle', { what, dir: t(b.dataset.prime ? 'ccw' : 'cw') });
    }
    hint.textContent = t('movesHint');
  }

  function setStatus(html, cls) { statusEl.innerHTML = html; statusEl.className = cls || ''; }

  function updateUI() {
    const p = game.current;
    const who = `<b class="${p}">${escapeHtml(seatLabel(p))}</b>`;

    if (mode === 'connecting') setStatus(t('connecting'));
    else if (outcome) {
      const msg = outcome.winner ? t('wins', { who: seatLabel(outcome.winner) }) : t('draw');
      setStatus(outcome.winner ? `<b class="${outcome.winner}">${escapeHtml(msg)}</b>` : escapeHtml(msg), outcome.winner || '');
    } else if (anim) setStatus(t('turning', { who }), p);
    else if (mode === 'p2p' && !relay.connectedCount()) setStatus(t('connectingServers'));
    else if (mode === 'p2p' && !netReady()) setStatus(net.hosting ? t('waitOpponentJoin') : t('connecting'));
    else if (mode === 'p2p' && !isMyTurn()) setStatus(t(game.phase === 'place' ? 'otherPlacing' : 'otherTurning', { who }), p);
    else if (mode === 'online' && !game.seats[p]) setStatus(t('waitSeat', { p: `<b class="${p}">${p}</b>` }), p);
    else if (mode === 'online' && !isMyTurn()) {
      setStatus(t(game.phase === 'place' ? 'otherPlacing' : 'otherTurning', { who }), p);
    } else {
      setStatus(t(game.phase === 'place' ? 'yourPlace' : 'yourMove', { who }), p);
    }

    const canMove = canAct('move');
    moveButtons.forEach(b => b.disabled = !canMove);
    movesEl.classList.toggle('active', canMove);
    if (!canAct('place') && !canMove) setHover(null);

    // Banner: shown only once the game is over (after the final turn has animated).
    if (outcome && !anim) {
      bannerText.textContent = outcome.winner ? t('wins', { who: seatLabel(outcome.winner) }) : t('draw');
      bannerText.style.color = outcome.winner === 'X' ? 'var(--x)' : outcome.winner === 'O' ? 'var(--o)' : 'var(--text)';
      banner.hidden = false;
    } else banner.hidden = true;

    const inMatch = mode === 'p2p' && net && (net.kind === 'match' || net.kind === 'watch');
    const mayReset = mode === 'local' || (mode === 'p2p' && net && net.kind === 'code' && netReady()) || (mode === 'online' && canWrite && (isSeated() || amOwner));
    newGameBtn.disabled = !mayReset;
    const bannerBtn = document.getElementById('bannerNew');
    bannerBtn.textContent = inMatch ? t(nextGameReady() ? 'nextGame' : 'toBracket') : t('playAgain');
    bannerBtn.hidden = !(mayReset || inMatch);

    renderSeats();
    renderNet();
    renderTourButton();
    renderInstall();
    // Spectators can't move, so the move buttons make room for the chat.
    movesEl.hidden = mode === 'p2p' && !!net && net.kind === 'watch';
    renderChat();
  }

  function renderSeats() {
    seatsEl.hidden = mode !== 'online';
    if (mode !== 'online') return;
    for (const p of ['X', 'O']) {
      const el = document.getElementById('seat' + p);
      const id = game.seats[p];
      const whoEl = el.querySelector('.who');
      const btn = el.querySelector('button');
      el.classList.toggle('turn', !outcome && game.current === p);
      whoEl.classList.toggle('empty', !id);
      whoEl.textContent = !id ? t('free') : id === myId ? t('youLower') : (names[id] || t(p === 'X' ? 'player1' : 'player2'));
      if (!id) {
        btn.textContent = t('playAs', { p });
        btn.hidden = !myId || !canWrite;
        btn.onclick = () => claimSeat(p);
      } else if (id === myId || amOwner) {
        btn.textContent = t(id === myId ? 'leaveSeat' : 'releaseSeat');
        btn.hidden = !canWrite;
        btn.onclick = () => leaveSeat(p);
      } else {
        btn.hidden = true;
        btn.onclick = null;
      }
    }
    refreshNames();
  }

  function showNote(text) {
    noteEl.textContent = text || '';
    noteEl.hidden = !text;
    const homeNote = document.getElementById('homeNote');
    if (homeNote) homeNote.textContent = text || '';
  }

  function rebuildLog() {
    logList.innerHTML = '';
    game.moves.forEach(appendLog);
  }
  function appendLog(m) {
    const li = document.createElement('li');
    const span = document.createElement('span');
    span.className = m.by;
    span.textContent = m.by;
    li.append(span, ' ' + m.f + (m.p ? "'" : ''));
    logList.appendChild(li);
    logList.parentElement.scrollTop = 1e6;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  // ---------- Actions ----------
  async function commit(patch) {
    if (mode === 'local' || mode === 'p2p') {
      game = normalize({ ...game, ...patch, ver: game.ver + 1 });
      sync();
      if (mode === 'p2p') publishGame();
      return;
    }
    if (mode !== 'online' || busy) return;
    busy = true;
    updateUI();
    try {
      if (gameExists) await gameRef.update(patch);
      else await gameRef.set({ ...game, ...patch });
      showNote('');
    } catch (e) {
      reportWriteError(e);
    } finally {
      busy = false;
      updateUI();
    }
  }

  function reportWriteError(e) {
    const code = e && e.code;
    if (code === 'invalid_argument' || code === 'not_granted') {
      canWrite = false;
      showNote(t('viewOnly'));
    } else if (code === 'resource_exhausted') {
      showNote(t('tooFast'));
    } else {
      showNote(t('saveFailed'));
    }
  }

  function placeMark(s) {
    if (!s || !canAct('place') || s.userData.mark) return false;
    const i = s.userData.index;
    const marks = game.marks.slice(0, i) + game.current + game.marks.slice(i + 1);
    commit({ marks, phase: 'move', last: i });
    return true;
  }

  // Before turning the cube, the player may change their mind: click an empty sticker to move
  // this turn's mark there, or click the mark itself to take it back.
  function changeMark(s) {
    if (!s || !canAct('move') || game.last < 0) return false;
    const i = s.userData.index, from = game.last;
    let marks = game.marks.slice(0, from) + '.' + game.marks.slice(from + 1);
    if (i === from) { commit({ marks, phase: 'place', last: -1 }); return true; }
    if (s.userData.mark) return false;
    marks = marks.slice(0, i) + game.current + marks.slice(i + 1);
    commit({ marks, last: i });
    return true;
  }

  function makeMove(face, prime) {
    if (!canAct('move')) return false;
    commit({
      moves: [...game.moves, { f: face, p: !!prime, by: game.current }],
      current: other(game.current),
      phase: 'place',
    });
    return true;
  }

  function newGame() {
    commit({ round: game.round + 1, marks: EMPTY_MARKS, moves: [], current: 'X', phase: 'place', last: -1 });
  }
  newGameBtn.addEventListener('click', newGame);
  document.getElementById('bannerNew').addEventListener('click', () => {
    if (mode === 'p2p' && net && net.kind === 'match' && nextGameReady()) playMatch(net.matchId);
    else if (mode === 'p2p' && net && (net.kind === 'match' || net.kind === 'watch')) openTourPanel();
    else newGame();
  });

  // Claiming a seat: take a short lease so two people clicking at once can't both get it.
  async function claimSeat(p) {
    if (mode !== 'online' || !myId || busy) return;
    busy = true;
    try {
      const lock = await db.doc('locks/seats').acquire({ holder: myId, ttlMs: 5000 });
      if (!lock.acquired) { showNote(t('seatBusy')); return; }
      const snap = await gameRef.get();
      const d = normalize(snap.exists ? snap.data() : null);
      if (d.seats[p] && d.seats[p] !== myId) { showNote(t('seatTaken')); return; }
      const seats = { ...d.seats, [p]: myId };
      if (seats[other(p)] === myId) seats[other(p)] = null; // one seat per person
      if (snap.exists) await gameRef.update({ seats });
      else await gameRef.set({ ...d, seats });
      showNote('');
    } catch (e) {
      reportWriteError(e);
    } finally {
      busy = false;
      updateUI();
    }
  }

  async function leaveSeat(p) {
    if (mode !== 'online') return;
    await commit({ seats: { ...game.seats, [p]: null } });
  }

  // ---------- Input: drag to rotate view, click to place ----------
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let pointer = null; // { id, x, y, startX, startY, moved }
  let hovered = null;

  function pickSticker(clientX, clientY) {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const hit = raycaster.intersectObjects(pickables, false)[0];
    return hit && hit.object.userData.isSticker ? hit.object : null;
  }

  function setHover(s) {
    if (s === hovered) return;
    const prev = hovered;
    hovered = s;
    if (prev) { prev.userData.hover = null; drawSticker(prev); }
    if (s) { s.userData.hover = game.current; drawSticker(s); }
    stage.classList.toggle('can-place', !!s);
  }

  stage.addEventListener('pointerdown', e => {
    if (pointer) return;
    pointer = { id: e.pointerId, x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY, moved: false };
    stage.setPointerCapture(e.pointerId);
  });

  const qTmp = new THREE.Quaternion(), X_AXIS = new THREE.Vector3(1, 0, 0), Y_AXIS = new THREE.Vector3(0, 1, 0);
  stage.addEventListener('pointermove', e => {
    if (pointer && e.pointerId === pointer.id) {
      if (!pointer.moved && Math.hypot(e.clientX - pointer.startX, e.clientY - pointer.startY) > 5) {
        pointer.moved = true;
        stage.classList.add('dragging');
        setHover(null);
      }
      if (pointer.moved) {
        const dx = e.clientX - pointer.x, dy = e.clientY - pointer.y;
        const speed = 0.008;
        qTmp.setFromAxisAngle(Y_AXIS, dx * speed);
        cubeGroup.quaternion.premultiply(qTmp);
        qTmp.setFromAxisAngle(X_AXIS, dy * speed);
        cubeGroup.quaternion.premultiply(qTmp);
      }
      pointer.x = e.clientX; pointer.y = e.clientY;
      return;
    }
    if (e.pointerType === 'mouse') {
      const s = canAct('place') || canAct('move') ? pickSticker(e.clientX, e.clientY) : null;
      setHover(s && (!s.userData.mark || (canAct('move') && s.userData.index === game.last)) ? s : null);
    }
  });

  function endPointer(e, cancelled) {
    if (!pointer || e.pointerId !== pointer.id) return;
    const wasClick = !pointer.moved && !cancelled;
    pointer = null;
    stage.classList.remove('dragging');
    if (!wasClick) return;
    const s = pickSticker(e.clientX, e.clientY);
    if (canAct('place')) placeMark(s);
    else changeMark(s);
  }
  stage.addEventListener('pointerup', e => endPointer(e, false));
  stage.addEventListener('pointercancel', e => endPointer(e, true));
  stage.addEventListener('pointerleave', () => { if (!pointer) setHover(null); });

  stage.addEventListener('wheel', e => {
    e.preventDefault();
    camera.position.z = Math.max(6, Math.min(22, camera.position.z * (1 + Math.sign(e.deltaY) * 0.08)));
  }, { passive: false });

  window.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) return;
    if (!tourPanel.hidden || !homeEl.hidden) return;
    const k = e.key.toUpperCase();
    if (FACES[k]) { e.preventDefault(); makeMove(k, e.shiftKey); }
  });

  // ---------- Loop ----------
  function tick(now) {
    if (anim) {
      const t = Math.min(1, (now - anim.start) / anim.dur);
      const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      anim.pivot.quaternion.setFromAxisAngle(anim.axis, anim.angle * eased);
      if (t >= 1) finishMoveAnimation();
    }
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ---------- Online play over public relays (no account needed) ----------
  // Every message goes to three free public MQTT brokers at once over secure websockets. Whichever are
  // reachable carry the game, so one broker being down or blocked doesn't stop play, on wifi or mobile data.
  // Brokers keep the latest ("retained") board per game, so a player who reloads or arrives late gets it.
  const BROKERS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
  const TOPIC_ROOT = 'kubus-kaas-en-eieren/v2/';
  const CONNECT_TIMEOUT_MS = 12000;
  const RETAINED_WAIT_MS = 2500;

  function makeCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    const rnd = new Uint32Array(6);
    crypto.getRandomValues(rnd);
    for (const r of rnd) s += chars[r % chars.length];
    return s;
  }
  const clientId = makeCode() + makeCode();
  const waitFor = (cond, ms) => new Promise(resolve => {
    const t0 = Date.now();
    const iv = setInterval(() => { if (cond() || Date.now() - t0 > ms) { clearInterval(iv); resolve(cond()); } }, 100);
  });
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (_) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) { /* optional */ } },
  };
  const onlineSupported = () => typeof window.mqtt !== 'undefined' && typeof WebSocket === 'function' && !(window.claude && typeof window.claude.use === 'function');

  const relay = {
    clients: [], handlers: new Map(), seen: new Set(), seenOrder: [], started: false,
    start() {
      if (this.started || !onlineSupported()) return;
      this.started = true;
      BROKERS.forEach((url, i) => {
        let c;
        try {
          c = mqtt.connect(url, { clientId: 'kke_' + clientId + '_' + i, clean: true, connectTimeout: 8000, reconnectPeriod: 3000, keepalive: 30 });
        } catch (_) { return; }
        c.on('connect', () => {
          for (const t of this.handlers.keys()) c.subscribe(TOPIC_ROOT + t, { qos: 1 });
          updateUI();
        });
        c.on('close', () => updateUI());
        c.on('error', () => { /* reconnects on its own */ });
        c.on('message', (topic, buf) => this.receive(topic, buf));
        this.clients.push(c);
      });
    },
    connectedCount() { return this.clients.filter(c => c.connected).length; },
    subscribe(topic, fn) {
      this.handlers.set(topic, fn);
      for (const c of this.clients) if (c.connected) c.subscribe(TOPIC_ROOT + topic, { qos: 1 });
    },
    unsubscribe(topic) {
      if (!this.handlers.delete(topic)) return;
      for (const c of this.clients) if (c.connected) c.unsubscribe(TOPIC_ROOT + topic);
    },
    publish(topic, payload, retain) {
      const body = JSON.stringify({ ...payload, id: makeCode() + makeCode(), from: clientId });
      for (const c of this.clients) c.publish(TOPIC_ROOT + topic, body, { qos: 1, retain: !!retain });
    },
    receive(fullTopic, buf) {
      const fn = this.handlers.get(fullTopic.slice(TOPIC_ROOT.length));
      if (!fn) return;
      let p;
      try { p = JSON.parse(String(buf)); } catch (_) { return; }
      if (!p || typeof p.id !== 'string' || this.seen.has(p.id)) return; // same message via another broker
      this.seen.add(p.id); this.seenOrder.push(p.id);
      if (this.seenOrder.length > 3000) this.seen.delete(this.seenOrder.shift());
      fn(p);
    },
  };

  // ---------- Online game: 1-on-1 with a code, or a tournament match ----------
  // net = { kind: 'code'|'match', topic, side, hosting, joined, opponentSeen, gotState, code, matchId, opponent }
  let net = null;
  const p2pPanel = document.getElementById('p2p');
  const p2pStart = document.getElementById('p2pStart');
  const p2pInfo = document.getElementById('p2pInfo');
  const p2pText = document.getElementById('p2pText');
  const copyBtn = document.getElementById('copyCode');
  const scheduleBtn = document.getElementById('openSchedule');
  const shareBtn = document.getElementById('shareLink');
  const leaveBtn = document.getElementById('leaveP2P');
  const joinInput = document.getElementById('joinCode');

  function netReady() {
    if (mode !== 'p2p' || !net) return false;
    if (net.kind === 'code' && net.hosting) return net.opponentSeen;
    return net.joined;
  }

  const publishGame = () => { if (net) relay.publish(net.topic + '/state', { t: 'state', game }, true); };

  function enterNet(cfg) {
    // Keep the match chat when moving to the next game of the same match; drop it otherwise.
    if (!((cfg.kind === 'match' || cfg.kind === 'watch') && cfg.matchId === chat.matchId)) leaveChat();
    leaveNet();
    relay.start();
    const n = net = { hosting: false, joined: false, opponentSeen: false, gotState: false, ...cfg };
    mode = 'p2p';
    showNote('');
    game = normalize(null); // fresh board until the shared one arrives
    applied.round = null;
    relay.subscribe(n.topic + '/state', p => {
      if (net !== n || p.t !== 'state' || !p.game) return;
      n.gotState = true;
      if (p.from !== clientId) n.opponentSeen = true;
      const incoming = normalize(p.game);
      if (incoming.ver > game.ver) { game = incoming; sync(); }
      else updateUI();
    });
    relay.subscribe(n.topic + '/hello', p => {
      if (net !== n || p.from === clientId) return;
      const first = !n.opponentSeen;
      n.opponentSeen = true;
      if (n.hosting || n.kind === 'match') publishGame(); // the newcomer gets the current board right away
      if (first && n.kind === 'match') relay.publish(n.topic + '/hello', { t: 'hello' });
      updateUI();
    });
    setTimeout(() => { if (net === n && !relay.connectedCount()) showNote(t('netErr')); }, CONNECT_TIMEOUT_MS);
    sync();
  }

  function leaveNet() {
    if (!net) return;
    relay.unsubscribe(net.topic + '/state');
    relay.unsubscribe(net.topic + '/hello');
    net = null;
  }

  function stopNet(keepNote) {
    leaveChat();
    leaveNet();
    if (!keepNote) showNote('');
    mode = 'local';
    sync();
    if (homeSupported()) showHome();
  }

  // 1-on-1: remember which side this browser played per code, so a reload can resume as the same player.
  const savedSide = code => (store.get('kke-sides') || {})[code] || null;
  const saveSide = (code, side) => { const m = store.get('kke-sides') || {}; m[code] = side; store.set('kke-sides', m); };

  function hostGame() {
    if (!onlineSupported()) return;
    const code = makeCode();
    saveSide(code, 'X');
    enterNet({ kind: 'code', code, topic: 'game/' + code, side: 'X', hosting: true });
    game = normalize({ round: 1, ver: 1 });
    sync();
    publishGame(); // retained, so the opponent finds the board when joining
  }

  async function joinGame() {
    const code = joinInput.value.trim().toUpperCase();
    if (!/^[A-Z0-9]{6}$/.test(code)) { showNote(t('enterCode')); return; }
    const side = savedSide(code) || 'O';
    enterNet({ kind: 'code', code, topic: 'game/' + code, side });
    const n = net;
    updateUI();
    if (!(await waitFor(() => relay.connectedCount() > 0, CONNECT_TIMEOUT_MS))) { if (net === n) { showNote(t('netErr')); stopNet(true); } return; }
    await waitFor(() => n.gotState, RETAINED_WAIT_MS);
    if (net !== n) return;
    if (!n.gotState) {
      showNote(t('gameNotFound', { code }));
      stopNet(true);
      return;
    }
    saveSide(code, side);
    n.joined = true;
    relay.publish(n.topic + '/hello', { t: 'hello' });
    updateUI();
  }

  function renderNet() {
    // Starting or joining happens on the home screen; this bar only shows the game you're in.
    const inNet = mode === 'p2p' && !!net;
    p2pPanel.hidden = !(inNet && onlineSupported());
    if (p2pPanel.hidden) return;
    p2pStart.hidden = inNet;
    p2pInfo.hidden = !inNet;
    if (!inNet) return;
    const isMatch = net.kind === 'match' || net.kind === 'watch';
    copyBtn.hidden = !(net.kind === 'code' && net.hosting);
    shareBtn.hidden = copyBtn.hidden || !canShareLinks();
    scheduleBtn.hidden = !isMatch;
    leaveBtn.hidden = isMatch;
    const side = `<b class="${net.side}-text">${net.side}</b>`;
    if (net.kind === 'watch') {
      const loc = tour && findMatch(net.matchId);
      let what = '', score = '';
      if (loc) {
        const m = loc.m, xs = xSlotOf(net.gameNo), os = xs === 'a' ? 'b' : 'a';
        what = roundName(loc.r) + (m.bestOf > 1 ? t('gameOfBest', { n: net.gameNo + 1, b: m.bestOf }) : '');
        if (m.bestOf > 1) score = t('score', { a: m.wins[xs], b: m.wins[os] });
      }
      p2pText.innerHTML = t('watchingBar', { what: escapeHtml(what), x: escapeHtml(net.xName), o: escapeHtml(net.oName) }) + escapeHtml(score);
    } else if (isMatch) {
      const loc = tour && findMatch(net.matchId);
      let rn = '', score = '';
      if (loc) {
        const m = loc.m, mine = m.a === tourPlayerId ? 'a' : 'b';
        rn = roundName(loc.r) + (m.bestOf > 1 ? t('gameOfBest', { n: net.gameNo + 1, b: m.bestOf }) : '') + ' · ';
        if (m.bestOf > 1) score = t('score', { a: m.wins[mine], b: m.wins[mine === 'a' ? 'b' : 'a'] });
      }
      p2pText.innerHTML = escapeHtml(rn) + t('youVs', { side, opp: escapeHtml(net.opponent) }) + escapeHtml(score);
    } else {
      const code = `<code>${net.code}</code>`;
      if (net.hosting) p2pText.innerHTML = t(netReady() ? 'hostConnected' : 'hostWaiting', { code, side });
      else p2pText.innerHTML = t(net.joined ? 'joinedGame' : 'joiningGame', { code, side });
    }
  }

  document.getElementById('hostBtn').addEventListener('click', hostGame);
  document.getElementById('joinBtn').addEventListener('click', joinGame);
  joinInput.addEventListener('keydown', e => { if (e.key === 'Enter') joinGame(); });
  leaveBtn.addEventListener('click', () => stopNet(false));
  scheduleBtn.addEventListener('click', () => openTourPanel());
  copyBtn.addEventListener('click', () => copyText(net && net.code, copyBtn, t('copyCode')));
  shareBtn.addEventListener('click', () => net && shareLink('g', net.code, shareBtn, t('shareLinkBtn')));

  async function copyText(text, btn, label) {
    if (!text) return;
    try { await navigator.clipboard.writeText(text); btn.textContent = t('copied'); }
    catch (_) { btn.textContent = text; }
    setTimeout(() => { btn.textContent = label; }, 1500);
  }

  // ---------- Links, installing as an app ----------
  // When the game is hosted on a website, a code can travel as a link: #g-CODE joins a 1-on-1 game,
  // #t-CODE opens the tournament screen with the code filled in.
  const canShareLinks = () => /^https?:$/.test(location.protocol) && !(window.claude && typeof window.claude.use === 'function');

  async function shareLink(kind, code, btn, label) {
    if (!code) return;
    const url = location.origin + location.pathname + '#' + kind + '-' + code;
    const text = t(kind === 't' ? 'shareTourText' : 'shareGameText', { code });
    if (navigator.share) {
      try { await navigator.share({ title: 'Kubus Kaas en Eieren', text, url }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    copyText(url, btn, label);
  }

  function openFromLink() {
    const m = /^#([gt])-([A-Za-z0-9]{6})$/.exec(location.hash);
    if (!m || !onlineSupported()) return;
    const code = m[2].toUpperCase();
    hideHome();
    if (m[1] === 'g') { joinInput.value = code; joinGame(); }
    else {
      openTourPanel();
      if (tourView === 'menu') {
        document.getElementById('tCode').value = code;
        document.getElementById('tName').focus();
      }
    }
  }

  let installPrompt = null;
  const installBtn = document.getElementById('installBtn');
  const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; updateUI(); });
  window.addEventListener('appinstalled', () => { installPrompt = null; showNote(''); updateUI(); });
  const installApp = async () => {
    if (installPrompt) {
      installPrompt.prompt();
      try { await installPrompt.userChoice; } catch (_) {}
      installPrompt = null;
      updateUI();
    } else if (isIOS()) {
      showNote(t('iosInstall'));
    }
  };
  installBtn.addEventListener('click', installApp);
  document.getElementById('hInstall').addEventListener('click', installApp);
  function renderInstall() {
    installBtn.hidden = !canShareLinks() || isStandalone() || !(installPrompt || isIOS());
    document.getElementById('hInstall').hidden = installBtn.hidden;
  }

  if ('serviceWorker' in navigator && canShareLinks() && document.querySelector('link[rel="manifest"]')) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* app still works online */ });
  }

  // ---------- Tournament ----------
  // The organizer's device runs the bracket and publishes it (retained) on tour/<code>/state.
  // Players announce themselves on /join and report match results on /result. They repeat both until
  // the organizer's bracket shows them, so nothing is lost while the organizer reconnects or reloads.
  // Each match is an ordinary online game on its own channel, tour/<code>/m/<match id>.
  let tour = null;          // latest bracket: { code, size, phase: 'lobby'|'running'|'done', players, rounds, champion, ver }
  let tourCode = null;
  let tourRole = null;      // 'org' | 'player'
  let tourPlayerId = null;  // my id in the bracket (the organizer may play too)
  let tourName = '';
  let tourView = 'menu';    // 'menu' | 'tour'
  let tourNoteText = '';
  let tourTimer = null;
  let pendingResults = {};  // matchId -> { winner, draw } still to be confirmed by the organizer
  const tourPanel = document.getElementById('tourPanel');
  const tourBody = document.getElementById('tourBody');
  const tourBtn = document.getElementById('tourBtn');

  const cleanName = s => String(s || '').replace(/\s+/g, ' ').trim().slice(0, 20);
  const playerName = id => { const p = tour && tour.players.find(x => x.id === id); return p ? p.name : '?'; };
  const roundName = r => t('rounds')[tour.rounds.length - 1 - r] || t('roundN', { n: r + 1 });
  const tourTopic = sub => 'tour/' + tourCode + '/' + sub;
  const saveTourRole = () => store.set('kke-tour-' + tourCode, { role: tourRole, playerId: tourPlayerId, name: tourName });

  function findMatch(id) {
    if (!tour) return null;
    for (let r = 0; r < tour.rounds.length; r++) {
      const i = tour.rounds[r].findIndex(m => m.id === id);
      if (i >= 0) return { r, i, m: tour.rounds[r][i] };
    }
    return null;
  }

  function myActiveMatch() {
    if (!tour || tour.phase !== 'running' || !tourPlayerId) return null;
    for (let r = 0; r < tour.rounds.length; r++) {
      for (let i = 0; i < tour.rounds[r].length; i++) {
        const m = tour.rounds[r][i];
        if ((m.a === tourPlayerId || m.b === tourPlayerId) && m.a && m.b && !m.winner) return { r, i, m };
      }
    }
    return null;
  }

  function randomInt(n) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }

  function setTourNote(text) {
    tourNoteText = text || '';
    const el = document.getElementById('tNote');
    if (el) el.textContent = tourNoteText;
  }

  function openTourPanel() {
    if (!onlineSupported()) return;
    tourView = tourCode ? 'tour' : 'menu';
    tourPanel.hidden = false;
    setHover(null);
    renderTour();
  }
  function closeTourPanel() {
    tourPanel.hidden = true;
    // Back to the game while a tournament match is open, otherwise back to the menu.
    if (!(mode === 'p2p' && net && (net.kind === 'match' || net.kind === 'watch')) && homeSupported()) showHome();
  }

  function subscribeTour() {
    relay.subscribe(tourTopic('state'), p => {
      if (p.t !== 'tour' || !p.tour || p.tour.code !== tourCode) return;
      if (tour && p.tour.ver <= tour.ver) return;
      tour = p.tour;
      afterTourChange();
    });
    if (tourRole === 'org') {
      relay.subscribe(tourTopic('join'), onJoin);
      relay.subscribe(tourTopic('result'), onResult);
    }
  }

  function leaveTour() {
    if (tourCode) ['state', 'join', 'result'].forEach(s => relay.unsubscribe(tourTopic(s)));
    clearInterval(tourTimer);
    tourTimer = null;
    if (mode === 'p2p' && net && (net.kind === 'match' || net.kind === 'watch')) stopNet(true);
    tour = null; tourCode = null; tourRole = null; tourPlayerId = null; tourName = ''; pendingResults = {};
  }

  // --- organizer ---
  function publishTour() { relay.publish(tourTopic('state'), { t: 'tour', tour }, true); }
  function bumpTour() { tour.ver++; publishTour(); afterTourChange(); }

  function createTour() {
    const name = cleanName(document.getElementById('tOrgName').value);
    const plays = document.getElementById('tPlays').checked;
    const size = document.getElementById('tSize').value === '16' ? 16 : 8;
    if (plays && !name) { setTourNote(t('needNameOrUncheck')); return; }
    relay.start();
    leaveTour();
    tourCode = makeCode();
    tourRole = 'org';
    tourPlayerId = plays ? 'p' + makeCode() + makeCode() : null;
    tourName = name;
    const reward = String(document.getElementById('tReward').value || '').replace(/\s+/g, ' ').trim().slice(0, 80) || null;
    tour = { code: tourCode, size, reward, phase: 'lobby', players: plays ? [{ id: tourPlayerId, name }] : [], rounds: [], champion: null, ver: 1 };
    saveTourRole();
    subscribeTour();
    publishTour();
    tourView = 'tour';
    setTourNote('');
    afterTourChange();
    setTimeout(() => { if (tourRole === 'org' && !relay.connectedCount()) setTourNote(t('netErr')); }, CONNECT_TIMEOUT_MS);
  }

  function onJoin(p) {
    if (tourRole !== 'org' || !tour || typeof p.playerId !== 'string') return;
    const name = cleanName(p.name);
    if (!name) return;
    const existing = tour.players.find(x => x.id === p.playerId);
    if (existing) {
      if (existing.name !== name && tour.phase === 'lobby') { existing.name = name; bumpTour(); }
      else publishTour();
      return;
    }
    if (tour.phase !== 'lobby' || tour.players.length >= tour.size) { publishTour(); return; }
    let unique = name, k = 2;
    while (tour.players.some(x => x.name.toLowerCase() === unique.toLowerCase())) unique = `${name} ${k++}`;
    tour.players.push({ id: p.playerId, name: unique });
    bumpTour();
  }

  // A match is a series of games (best of 1, 3 or 5). X alternates: player a starts game 1, b game 2, ...
  const xSlotOf = gameNo => gameNo % 2 === 0 ? 'a' : 'b';
  const winsNeeded = m => Math.ceil((m.bestOf || 1) / 2);

  function onResult(p) {
    if (tourRole !== 'org' || !tour || tour.phase !== 'running') return;
    const loc = findMatch(p.matchId);
    if (!loc) return;
    const m = loc.m;
    const gameNo = Number.isInteger(p.game) ? p.game : 0;
    // Already decided, or a game we already counted: re-send so the reporter sees it.
    if (m.winner || !m.a || !m.b || gameNo !== m.games.length) { publishTour(); return; }
    const xSlot = xSlotOf(gameNo), oSlot = xSlot === 'a' ? 'b' : 'a';
    let slot, how = 'win';
    if (p.winner === 'X') slot = xSlot;
    else if (p.winner === 'O') slot = oSlot;
    else if (p.draw) { slot = randomInt(2) ? 'a' : 'b'; how = 'coin'; } // draw: a coin flip decides the game
    else return;
    m.games.push({ winner: slot, how });
    m.wins[slot]++;
    if (m.wins[slot] >= winsNeeded(m)) {
      m.winner = m[slot];
      m.how = m.bestOf > 1 ? 'series' : how;
      advance(loc.r, loc.i);
    }
    bumpTour();
  }

  function advance(r, i) {
    const m = tour.rounds[r][i];
    if (r === tour.rounds.length - 1) { tour.champion = m.winner; tour.phase = 'done'; return; }
    tour.rounds[r + 1][i >> 1][i % 2 === 0 ? 'a' : 'b'] = m.winner;
  }

  function startTour() {
    if (tourRole !== 'org' || !tour || tour.phase !== 'lobby' || tour.players.length < 2) return;
    const ids = tour.players.map(p => p.id);
    for (let i = ids.length - 1; i > 0; i--) { const j = randomInt(i + 1); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    // Smallest bracket that fits everyone; empty spots become byes (that player goes straight through).
    let size = 2;
    while (size < ids.length) size *= 2;
    const half = size / 2;
    const roundCount = Math.log2(size);
    // Final: best of 5. Semi-finals: best of 3. Earlier rounds: a single game.
    const bestOf = r => r === roundCount - 1 ? 5 : r === roundCount - 2 ? 3 : 1;
    const newMatch = (r, i, a, b) => ({ id: `r${r}m${i}`, a, b, winner: null, how: null, bestOf: bestOf(r), wins: { a: 0, b: 0 }, games: [] });
    const rounds = [Array.from({ length: half }, (_, i) => newMatch(0, i, ids[i] || null, ids[half + i] || null))];
    for (let r = 1, n = half / 2; n >= 1; r++, n /= 2) {
      rounds.push(Array.from({ length: n }, (_, i) => newMatch(r, i, null, null)));
    }
    tour.rounds = rounds;
    tour.phase = 'running';
    rounds[0].forEach((m, i) => { if (m.a && !m.b) { m.winner = m.a; m.how = 'bye'; advance(0, i); } });
    bumpTour();
  }

  // --- players ---
  async function joinTour() {
    const code = document.getElementById('tCode').value.trim().toUpperCase();
    const name = cleanName(document.getElementById('tName').value);
    if (!/^[A-Z0-9]{6}$/.test(code)) { setTourNote(t('enterTourCode')); return; }
    const saved = store.get('kke-tour-' + code);
    if (!saved && !name) { setTourNote(t('enterName')); return; }
    relay.start();
    leaveTour();
    tourCode = code;
    if (saved && saved.role === 'org') { // this browser organizes this tournament: take it up again
      tourRole = 'org'; tourPlayerId = saved.playerId; tourName = saved.name || '';
    } else {
      tourRole = 'player';
      tourPlayerId = (saved && saved.playerId) || 'p' + makeCode() + makeCode();
      tourName = name || (saved && saved.name) || '';
    }
    tourView = 'tour';
    setTourNote('');
    subscribeTour();
    renderTour();
    if (!(await waitFor(() => relay.connectedCount() > 0, CONNECT_TIMEOUT_MS))) { if (tourCode === code) setTourNote(t('netErr')); return; }
    await waitFor(() => !!tour, RETAINED_WAIT_MS);
    if (tourCode !== code) return;
    if (!tour) {
      leaveTour();
      tourView = 'menu';
      renderTour();
      setTourNote(t('tourNotFound', { code }));
      return;
    }
    saveTourRole();
    if (tourRole === 'org') publishTour();
    tourTick();
    tourTimer = setInterval(tourTick, 4000);
  }

  // Repeats what the organizer hasn't confirmed yet: joining the lobby and match results.
  function tourTick() {
    if (!tour || !tourCode) return;
    if (tourRole === 'player' && tour.phase === 'lobby' && tourName &&
        !tour.players.some(p => p.id === tourPlayerId) && tour.players.length < tour.size) {
      relay.publish(tourTopic('join'), { t: 'join', playerId: tourPlayerId, name: tourName });
    }
    for (const [key, r] of Object.entries(pendingResults)) {
      const loc = findMatch(r.matchId);
      if (!loc || loc.m.winner || loc.m.games.length > r.game) { delete pendingResults[key]; continue; }
      if (tourRole === 'org') onResult(r);
      else relay.publish(tourTopic('result'), { t: 'result', ...r });
    }
  }

  function reportMatchResult(matchId, gameNo, winner) {
    const key = matchId + '#' + gameNo;
    if (!tour || pendingResults[key]) return;
    const loc = findMatch(matchId);
    if (!loc || loc.m.winner || loc.m.games.length > gameNo) return;
    pendingResults[key] = { matchId, game: gameNo, winner: winner || null, draw: !winner };
    tourTick();
  }

  // The series this device is playing goes on, and the organizer has counted the game just played.
  function nextGameReady() {
    if (!(mode === 'p2p' && net && net.kind === 'match')) return false;
    const loc = findMatch(net.matchId);
    return !!loc && !loc.m.winner && loc.m.games.length > net.gameNo;
  }

  // Spectating: anyone without a match to play right now can follow a live match, read-only.
  // A spectator only listens to the match channel and never sends anything to it.
  const canSpectate = m => !!(tour && tour.phase === 'running' && m.a && m.b && !m.winner &&
    m.a !== tourPlayerId && m.b !== tourPlayerId && !myActiveMatch());

  async function watchMatch(id) {
    const loc = findMatch(id);
    if (!loc || !canSpectate(loc.m)) return;
    const m = loc.m, gameNo = m.games.length, xs = xSlotOf(gameNo);
    enterNet({
      kind: 'watch', code: tourCode, matchId: m.id, gameNo, side: null,
      topic: tourTopic('m/' + m.id + '/g' + gameNo),
      xName: playerName(m[xs]), oName: playerName(m[xs === 'a' ? 'b' : 'a']),
    });
    const n = net;
    joinChat(m.id, 'watch');
    closeTourPanel();
    updateUI();
    if (!(await waitFor(() => relay.connectedCount() > 0, CONNECT_TIMEOUT_MS))) { if (net === n) showNote(t('netErr')); return; }
    if (net !== n) return;
    n.joined = true;
    updateUI();
  }

  // ---------- Match chat ----------
  // One text chat per tournament match on tour/<code>/m/<id>/chat, kept for the whole series.
  // Spectators read and write; the two players only read, behind a closed button that never pops open.
  // Only messages sent while you are in the match are shown (nothing is stored).
  // One message per 5 seconds, counted per match (switching matches doesn't reset it).
  const CHAT_MAX = 100, CHAT_GAP_MS = 5000;
  const chat = { matchId: null, topic: null, role: null, msgs: [], unread: 0, open: false };
  const chatLastSent = {}; // matchId -> time of this device's last message there
  let chatCooldownTimer = null;
  const chatWaitSeconds = () => Math.max(0, Math.ceil((CHAT_GAP_MS - (Date.now() - (chatLastSent[chat.matchId] || 0))) / 1000));

  // The send button counts down while the 5 seconds run, then shows "Send" again.
  function renderChatCooldown() {
    const btn = document.querySelector('#chatForm button');
    const s = chat.matchId ? chatWaitSeconds() : 0;
    btn.disabled = s > 0;
    btn.textContent = s > 0 ? `${t('send')} (${s})` : t('send');
    clearTimeout(chatCooldownTimer);
    if (s > 0) chatCooldownTimer = setTimeout(renderChatCooldown, 250);
    else if (chat.role === 'watch') document.getElementById('chatNote').textContent = '';
  }
  const chatEl = document.getElementById('chat');
  const chatPanel = document.getElementById('chatPanel');
  const chatList = document.getElementById('chatList');
  const chatInput = document.getElementById('chatInput');

  function joinChat(matchId, role) {
    if (chat.matchId !== matchId) {
      leaveChat();
      chat.matchId = matchId;
      chat.topic = tourTopic('m/' + matchId + '/chat');
      chat.msgs = [];
      chat.unread = 0;
      chatList.textContent = '';
      relay.subscribe(chat.topic, receiveChat);
    }
    if (chat.role !== role) chat.open = role === 'watch'; // spectators start with it open, players closed
    chat.role = role;
    document.getElementById('chatNote').textContent = role === 'watch' ? '' : t('chatPlayersReadOnly');
    renderChat();
  }

  function leaveChat() {
    if (chat.topic) relay.unsubscribe(chat.topic);
    Object.assign(chat, { matchId: null, topic: null, role: null, msgs: [], unread: 0, open: false });
    chatList.textContent = '';
    renderChat();
  }

  function receiveChat(p) {
    if (p.t !== 'chat' || typeof p.text !== 'string') return;
    const text = p.text.replace(/\s+/g, ' ').trim().slice(0, 200);
    if (!text) return;
    const msg = { name: cleanName(p.name) || t('spectator'), text, mine: p.from === clientId };
    chat.msgs.push(msg);
    if (chat.msgs.length > CHAT_MAX) { chat.msgs.shift(); chatList.firstChild && chatList.firstChild.remove(); }
    const li = document.createElement('li');
    if (msg.mine) li.className = 'mine';
    const b = document.createElement('b');
    b.textContent = msg.name;
    li.append(b, msg.text); // text only: never interpreted as HTML
    chatList.appendChild(li);
    chatList.scrollTop = chatList.scrollHeight;
    if (!chat.open && !msg.mine) chat.unread++;
    renderChat();
  }

  function sendChat(e) {
    e.preventDefault();
    if (chat.role !== 'watch' || !chat.topic) return;
    const text = chatInput.value.replace(/\s+/g, ' ').trim().slice(0, 200);
    if (!text) return;
    const wait = chatWaitSeconds();
    if (wait > 0) { document.getElementById('chatNote').textContent = t('chatTooFast', { s: wait }); renderChatCooldown(); return; }
    chatLastSent[chat.matchId] = Date.now();
    document.getElementById('chatNote').textContent = '';
    relay.publish(chat.topic, { t: 'chat', text, name: tourName || '' });
    chatInput.value = '';
    renderChatCooldown();
  }

  function renderChat() {
    const inGame = mode === 'p2p' && net && (net.kind === 'match' || net.kind === 'watch') && chat.matchId === net.matchId;
    chatEl.hidden = !inGame;
    document.body.classList.toggle('chat-open', inGame && chat.open);
    if (!inGame) return;
    chatPanel.hidden = !chat.open;
    document.getElementById('chatToggle').hidden = chat.open;
    document.getElementById('chatForm').hidden = chat.role !== 'watch';
    if (chat.role === 'watch') renderChatCooldown();
    document.getElementById('chatEmpty').hidden = chat.msgs.length > 0;
    if (chat.role !== 'watch') document.getElementById('chatNote').textContent = t('chatPlayersReadOnly');
    const badge = document.getElementById('chatBadge');
    badge.hidden = !chat.unread;
    badge.textContent = chat.unread > 9 ? '9+' : String(chat.unread);
    // On a phone the move buttons span the bottom; sit just above them while they are shown.
    const narrow = window.innerWidth <= 760;
    chatEl.style.bottom = narrow && !movesEl.hidden ? `calc(${movesEl.offsetHeight + 24}px + env(safe-area-inset-bottom, 0px))` : '';
  }

  document.getElementById('chatToggle').addEventListener('click', () => {
    chat.open = true; chat.unread = 0; renderChat();
    chatList.scrollTop = chatList.scrollHeight;
    if (chat.role === 'watch') chatInput.focus();
  });
  document.getElementById('chatClose').addEventListener('click', () => { chat.open = false; renderChat(); });
  document.getElementById('chatForm').addEventListener('submit', sendChat);
  window.addEventListener('resize', renderChat);

  async function playMatch(id) {
    const loc = findMatch(id);
    if (!loc || loc.m.winner) return;
    const m = loc.m;
    const gameNo = m.games.length;
    const side = m[xSlotOf(gameNo)] === tourPlayerId ? 'X' : 'O';
    enterNet({
      kind: 'match', code: tourCode, matchId: m.id, gameNo, topic: tourTopic('m/' + m.id + '/g' + gameNo), side,
      opponent: playerName(m.a === tourPlayerId ? m.b : m.a),
    });
    const n = net;
    joinChat(m.id, 'player');
    closeTourPanel();
    updateUI();
    if (!(await waitFor(() => relay.connectedCount() > 0, CONNECT_TIMEOUT_MS))) { if (net === n) showNote(t('netErr')); return; }
    await waitFor(() => n.gotState, RETAINED_WAIT_MS);
    if (net !== n) return;
    if (!n.gotState && side === 'X') { game = normalize({ round: 1, ver: 1 }); sync(); publishGame(); } // X opens the board
    n.joined = true;
    relay.publish(n.topic + '/hello', { t: 'hello' });
    updateUI();
  }

  function afterTourChange() {
    if (tour && tourRole === 'player' && tour.players.some(p => p.id === tourPlayerId)) saveTourRole();
    tourTick();
    // A drawn game was settled by a coin: tell the two players (and spectators) who it picked.
    if (mode === 'p2p' && net && (net.kind === 'match' || net.kind === 'watch')) {
      const loc = findMatch(net.matchId);
      const g = loc && loc.m.games[net.gameNo];
      if (g && g.how === 'coin') showNote(t('coinGame', { name: playerName(loc.m[g.winner]) }));
      if (net.kind === 'watch' && loc) {
        if (loc.m.winner) showNote(t('matchWonBy', { name: playerName(loc.m.winner) }));
        else if (loc.m.games.length > net.gameNo) {
          // The series goes on: after a moment to see the result, follow the next game.
          const n = net;
          setTimeout(() => { if (net === n) watchMatch(n.matchId); }, 3000);
        }
      }
    }
    if (!tourPanel.hidden && tourView === 'tour') renderTour();
    updateUI();
  }

  function renderTourButton() {
    tourBtn.hidden = !onlineSupported() || mode === 'online' || mode === 'connecting';
    const active = myActiveMatch();
    const ready = !!active && !(mode === 'p2p' && net && net.kind === 'match' && net.matchId === active.m.id && net.gameNo === active.m.games.length);
    tourBtn.classList.toggle('ready', ready);
    tourBtn.textContent = t(ready ? 'yourMatch' : 'tour');
  }
  tourBtn.addEventListener('click', openTourPanel);

  // --- tournament panel ---
  function renderTour() {
    if (tourPanel.hidden) return;
    if (tourView === 'menu') { renderTourMenu(); return; }
    const me = tourPlayerId;
    const share = canShareLinks() ? `<button type="button" data-act="share">${t('shareLinkBtn')}</button>` : '';
    let html = `<div class="tp-head"><h2>${t('tour')} <code>${escapeHtml(tourCode || '')}</code></h2>
      <div class="acts"><button type="button" data-act="copy">${t('copyCode')}</button>${share}<button type="button" data-act="close">${t('back')}</button></div></div>
      <p class="tp-note" id="tNote">${escapeHtml(tourNoteText)}</p>`;
    if (!tour) {
      html += `<div class="tp-card"><p>${t('connectingTour')}</p></div>`;
    } else if (tour.phase === 'lobby') {
      const inList = tour.players.some(p => p.id === me);
      const n = tour.players.length;
      const name = escapeHtml(tourName);
      let info;
      if (tourRole === 'org') {
        info = `<p>${t('orgInfo', { code: escapeHtml(tourCode) })}</p>
          <p>${t('notFull')}</p>
          <button type="button" class="primary" data-act="start" ${n < 2 ? 'disabled' : ''}>${n === 1 ? t('startWith1') : t('startWithN', { n })}</button>`;
      } else if (inList) info = `<p>${t('waitingStart', { name })}</p>`;
      else if (n >= tour.size) info = `<p>${t('tourFull')}</p>`;
      else info = `<p>${t('signingUp', { name })}</p>`;
      const chips = tour.players.map(p => `<span class="${p.id === me ? 'me' : ''}">${escapeHtml(p.name)}${p.id === me ? escapeHtml(t('youTag')) : ''}</span>`).join('');
      html += `<div class="tp-card tp-me"><h3>${t('playersCount', { n, size: tour.size })}</h3>
        <div class="players">${chips || `<span>${t('nobodyYet')}</span>`}</div>
        ${info}</div>` + renderTourRules();
    } else {
      html += renderTourStatus() + renderBracket() + renderTourRules();
    }
    html += `<div><button type="button" data-act="leave">${t(tourRole === 'org' ? 'closeTourOrg' : 'leaveTour')}</button></div>`;
    tourBody.innerHTML = html;
  }

  function renderTourStatus() {
    const me = tourPlayerId;
    let body;
    if (tour.phase === 'done') {
      body = `<div class="champion">${escapeHtml(t('champion', { name: playerName(tour.champion) }))}${tour.champion === me ? escapeHtml(t('youExcl')) : ''}</div>`;
      if (tour.reward) body += `<p class="big" style="text-align:center">${t('prize', { reward: escapeHtml(tour.reward) })}</p>`;
    } else {
      const active = myActiveMatch();
      const inBracket = me && tour.rounds[0].some(m => m.a === me || m.b === me);
      const out = inBracket && tour.rounds.some(rd => rd.some(m => m.winner && m.winner !== me && (m.a === me || m.b === me)));
      if (active) {
        const m = active.m;
        const mine = m.a === me ? 'a' : 'b', theirs = mine === 'a' ? 'b' : 'a';
        const series = m.bestOf > 1
          ? `<p>${t('seriesInfo', { bo: m.bestOf, need: winsNeeded(m), a: m.wins[mine], b: m.wins[theirs] })}</p>` : '';
        const label = m.bestOf > 1 ? t('playGameN', { n: m.games.length + 1 }) : t('playMatch');
        body = `<p class="big">${t('vsLine', { round: escapeHtml(roundName(active.r)), opp: escapeHtml(playerName(m[theirs])) })}</p>${series}
          <button type="button" class="primary" data-act="play" data-id="${m.id}">${label}</button>`;
      } else if (out) body = `<p class="big">${t('eliminated')}</p><p>${t('keepFollowing')}</p>`;
      else if (inBracket) body = `<p class="big">${t('through')}</p>`;
      else body = `<p class="big">${t('watching')}</p>`;
    }
    const orgNote = tourRole === 'org' && tour.phase !== 'done' ? `<p>${t('orgKeepOpen')}</p>` : '';
    const spectate = tour.phase === 'running' && tour.rounds.some(rd => rd.some(canSpectate)) ? `<p>${t('spectateHint')}</p>` : '';
    return `<div class="tp-card tp-me">${body}${spectate}${orgNote}</div>`;
  }

  function renderBracket() {
    const me = tourPlayerId;
    const slot = (m, key) => {
      const id = m[key];
      const cls = ['slot'];
      if (!id) cls.push('empty');
      else if (m.winner === id) cls.push('win');
      else if (m.winner) cls.push('lose');
      if (id && id === me) cls.push('me');
      const name = id ? playerName(id) : t(m.how === 'bye' ? 'byeRound' : 'unknownYet');
      // Series show the score; single games show who started as X.
      const right = m.bestOf > 1 ? (m.a && m.b ? String(m.wins[key]) : '') : (key === 'a' ? 'X' : 'O');
      return `<div class="${cls.join(' ')}"><span class="nm" data-you="${escapeHtml(t('youTag'))}">${escapeHtml(name)}</span><span class="side">${right}</span></div>`;
    };
    const tag = m => {
      if (m.how === 'bye') return t('byeRound');
      const coins = (m.games || []).filter(g => g.how === 'coin').length;
      if (m.bestOf === 1 && coins) return t('tagCoin');
      const parts = [];
      if (!m.winner && m.a && m.b) parts.push(m.bestOf > 1 ? t('tagLiveGame', { n: m.games.length + 1 }) : t('tagLive'));
      if (m.bestOf > 1 && coins) parts.push(t('tagCoins', { n: coins }));
      return parts.join(' · ');
    };
    const bo = r => tour.rounds[r][0].bestOf > 1 ? t('boSuffix', { n: tour.rounds[r][0].bestOf }) : '';
    const cols = tour.rounds.map((rd, r) => `<div class="round"><h4>${escapeHtml(roundName(r) + bo(r))}</h4><div class="matches">${
      rd.map(m => `<div class="match ${!m.winner && m.a && m.b ? 'live' : ''}">${slot(m, 'a')}${slot(m, 'b')}${tag(m) ? `<div class="tag">${escapeHtml(tag(m))}</div>` : ''}${
        canSpectate(m) ? `<button type="button" class="watch-btn" data-act="watch" data-id="${m.id}">${t('watchBtn')}</button>` : ''}</div>`).join('')
    }</div></div>`).join('');
    return `<div class="bracket-scroll"><div class="bracket">${cols}</div></div>`;
  }

  function renderTourRules() {
    const reward = tour.reward ? `<p>${t('prizeForWinner', { reward: escapeHtml(tour.reward) })}</p>` : '';
    return `<div class="tp-card"><h3>${t('howItWorks')}</h3><p>${t('howItWorksText')}</p>${reward}</div>`;
  }

  function renderTourMenu() {
    // Keep what was typed when the language changes while this form is open.
    const keep = {};
    for (const id of ['tSize', 'tOrgName', 'tReward', 'tCode', 'tName']) { const el = document.getElementById(id); if (el) keep[id] = el.value; }
    const plays = document.getElementById('tPlays');
    tourBody.innerHTML = `<div class="tp-head"><h2>${t('tour')}</h2><div class="acts"><button type="button" data-act="close">${t('back')}</button></div></div>
      <p class="tp-note" id="tNote">${escapeHtml(tourNoteText)}</p>
      <div class="tp-grid">
        <section class="tp-card">
          <h3>${t('organize')}</h3>
          <p>${t('organizeDesc')}</p>
          <label>${t('numPlayers')}
            <select id="tSize"><option value="8">${t('nPlayers', { n: 8 })}</option><option value="16">${t('nPlayers', { n: 16 })}</option></select></label>
          <label class="chk"><input type="checkbox" id="tPlays" checked> ${t('iPlay')}</label>
          <label>${t('yourName')} <input type="text" id="tOrgName" maxlength="20" autocomplete="nickname" placeholder="${escapeHtml(t('namePh1'))}"></label>
          <label>${t('prizeOptional')} <input type="text" id="tReward" maxlength="80" autocomplete="off" placeholder="${escapeHtml(t('prizePh'))}"></label>
          <button type="button" class="primary" data-act="create">${t('createTour')}</button>
        </section>
        <section class="tp-card">
          <h3>${t('joinTourTitle')}</h3>
          <p>${t('joinTourDesc')}</p>
          <label>${t('tourCode')} <input type="text" id="tCode" maxlength="6" autocomplete="off" spellcheck="false" placeholder="CODE"></label>
          <label>${t('yourName')} <input type="text" id="tName" maxlength="20" autocomplete="nickname" placeholder="${escapeHtml(t('namePh2'))}"></label>
          <button type="button" class="primary" data-act="join">${t('join')}</button>
        </section>
      </div>`;
    for (const [id, v] of Object.entries(keep)) document.getElementById(id).value = v;
    if (plays) document.getElementById('tPlays').checked = plays.checked;
  }

  tourBody.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const act = el.dataset.act;
    if (act === 'close') closeTourPanel();
    else if (act === 'create') createTour();
    else if (act === 'join') joinTour();
    else if (act === 'start') startTour();
    else if (act === 'play') playMatch(el.dataset.id);
    else if (act === 'watch') watchMatch(el.dataset.id);
    else if (act === 'copy') copyText(tourCode, el, t('copyCode'));
    else if (act === 'share') shareLink('t', tourCode, el, t('shareLinkBtn'));
    else if (act === 'leave') { leaveTour(); tourView = 'menu'; setTourNote(''); renderTour(); updateUI(); }
  });
  tourBody.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
    if (e.target.id === 'tCode' || e.target.id === 'tName') joinTour();
    if (e.target.id === 'tOrgName' || e.target.id === 'tReward') createTour();
  });
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && !tourPanel.hidden) closeTourPanel(); });

  // ---------- Home screen ----------
  // The menu shown at start: play on one device, 1-on-1 online, tournament, rules, report a bug.
  // Not used in the claude.ai version, which has its own signed-in seats.
  const homeEl = document.getElementById('home');
  const menuBtn = document.getElementById('menuBtn');
  const homeSupported = () => !(window.claude && typeof window.claude.use === 'function');

  function showHome(view) {
    if (!homeSupported()) return;
    for (const id of ['homeMain', 'homeRules', 'homeBug', 'homeShare']) document.getElementById(id).hidden = true;
    document.getElementById({ rules: 'homeRules', bug: 'homeBug', share: 'homeShare' }[view] || 'homeMain').hidden = false;
    const online = onlineSupported();
    document.getElementById('hOnlineCard').hidden = !online;
    document.getElementById('hTourCard').hidden = !online;
    document.getElementById('hBugCard').hidden = !online;
    // Offer to go back only when there is a game worth returning to.
    document.getElementById('hResume').hidden = !(mode === 'p2p' || game.moves.length || game.marks !== EMPTY_MARKS);
    homeEl.hidden = false;
    document.body.classList.add('home-open');
    setHover(null);
    homeEl.scrollTop = 0;
  }
  function hideHome() { homeEl.hidden = true; document.body.classList.remove('home-open'); }

  menuBtn.hidden = !homeSupported();
  menuBtn.addEventListener('click', () => showHome());
  homeEl.addEventListener('click', e => {
    const el = e.target.closest('[data-home]');
    if (el) showHome(el.dataset.home);
  });
  document.getElementById('hLocal').addEventListener('click', () => {
    if (mode === 'p2p') { leaveNet(); mode = 'local'; }
    showNote('');
    hideHome();
    newGame();
  });
  document.getElementById('hHost').addEventListener('click', () => { hideHome(); hostGame(); });
  const homeJoin = () => {
    const code = document.getElementById('hCode').value.trim().toUpperCase();

  document.getElementById('hRules').addEventListener('click', () => showHome('rules'));
  document.getElementById('hBug').addEventListener('click', () => { setBugMessages('', ''); showHome('bug'); });

  // ---------- Sharing the app ----------
  // Always shares the public web address, also from the downloaded file or an installed app.
  const APP_URL = 'https://briefcasejona.github.io/kubus-kaas-en-eieren/';
  const QR_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
  const shareOk = text => { document.getElementById('shareOk').textContent = text || ''; };

  async function shareApp() {
    const data = {
      title: 'Kubus Kaas en Eieren',
      text: t('shareAppText'),
      url: APP_URL,
    };
    if (navigator.share) {
      try { await navigator.share(data); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    // No share menu (most computers): copy the link and show the QR screen with the link visible.
    showSharePage();
    copyText(APP_URL, document.getElementById('shareCopy'), t('copyLink'));
    shareOk(t('linkCopiedPaste'));
  }

  let qrLoading = null;
  function loadQrLib() {
    if (window.qrcode) return Promise.resolve();
    if (!qrLoading) {
      qrLoading = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = QR_LIB;
        s.onload = resolve;
        s.onerror = () => { qrLoading = null; reject(new Error('qr')); };
        document.head.appendChild(s);
      });
    }
    return qrLoading;
  }

  async function showSharePage() {
    shareOk('');
    document.getElementById('shareUrl').textContent = APP_URL;
    showHome('share');
    const box = document.getElementById('shareQr');
    if (box.dataset.ready) return;
    box.textContent = t('qrLoading');
    try {
      await loadQrLib();
      const qr = window.qrcode(0, 'M');
      qr.addData(APP_URL);
      qr.make();
      box.innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
      box.dataset.ready = '1';
    } catch (_) {
      box.textContent = t('qrFailed');
    }
  }

  document.getElementById('hShare').addEventListener('click', shareApp);
  document.getElementById('hShareQr').addEventListener('click', showSharePage);
  document.getElementById('shareSend').addEventListener('click', shareApp);
  document.getElementById('shareCopy').addEventListener('click', e => {
    copyText(APP_URL, e.currentTarget, t('copyLink'));
    shareOk(t('linkCopied'));
  });

  // ---------- Bug reports ----------
  // Reports go to a private-ish ntfy.sh mailbox. A scheduled Claude task on the owner's computer reads them,
  // separates real bugs from noise, and prepares fixes that the owner approves before they go live.
  const BUG_TOPIC = 'kke-bugs-q7Vt2mZx9KpR4wLs8NcY';
  const APP_VERSION = '20261008165239'; // filled in by build.ps1
  const BUG_WAIT_MS = 2 * 60 * 1000;

  function setBugMessages(error, ok) {
    document.getElementById('bugError').textContent = error || '';
    document.getElementById('bugOk').textContent = ok || '';
  }

  async function sendBug() {
    const textEl = document.getElementById('bugText'), stepsEl = document.getElementById('bugSteps');
    const text = textEl.value.replace(/\s+/g, ' ').trim();
    const steps = stepsEl.value.replace(/\s+/g, ' ').trim();
    if (text.length < 15) { setBugMessages(t('bugTooShort'), ''); return; }
    const last = Number(store.get('kke-bug-last')) || 0;
    if (Date.now() - last < BUG_WAIT_MS) { setBugMessages(t('bugWait'), ''); return; }
    const btn = document.getElementById('bugSend');
    btn.disabled = true;
    setBugMessages('', '');
    const report = {
      t: 'bug', text: text.slice(0, 1000), steps: steps.slice(0, 500), appVersion: APP_VERSION,
      mode: mode === 'p2p' && net ? 'online-' + net.kind : mode, userAgent: navigator.userAgent.slice(0, 200),
      time: new Date().toISOString(),
    };
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 10000);
    try {
      const res = await fetch('https://ntfy.sh/' + BUG_TOPIC, { method: 'POST', body: JSON.stringify(report), signal: ctrl.signal });
      if (res.status === 429) throw new Error('busy');
      if (!res.ok) throw new Error('http');
      store.set('kke-bug-last', Date.now());
      textEl.value = ''; stepsEl.value = '';
      setBugMessages('', t('bugThanks'));
    } catch (e) {
      setBugMessages(e && e.message === 'busy'
        ? t('bugBusy')
        : t('bugFailed'), '');
    } finally {
      clearTimeout(timer);
      btn.disabled = false;
    }
  }
  document.getElementById('bugSend').addEventListener('click', sendBug);

  // ---------- Language switch ----------
  let modeHelpKey = 'modeHelpLocalOnly';

  // Re-renders every piece of text in the chosen language. Only this device changes.
  function applyLang() {
    document.documentElement.lang = LANG;
    for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
    for (const el of document.querySelectorAll('[data-i18n-html]')) el.innerHTML = t(el.dataset.i18nHtml);
    for (const el of document.querySelectorAll('[data-i18n-ph]')) el.placeholder = t(el.dataset.i18nPh);
    for (const el of document.querySelectorAll('[data-i18n-aria]')) el.setAttribute('aria-label', t(el.dataset.i18nAria));
    for (const b of document.querySelectorAll('#langSwitch [data-lang]')) b.setAttribute('aria-pressed', String(b.dataset.lang === LANG));
    document.getElementById('modeHelp').textContent = t(modeHelpKey);
    labelMoveButtons();
    updateUI();
    renderTour();
  }

  function setLang(lang) {
    if (!LANGS.includes(lang) || lang === LANG) return;
    LANG = lang;
    try { localStorage.setItem('kke-lang', lang); } catch (_) { /* still switches for this visit */ }
    // Messages already on screen were written in the old language; clear them rather than mix languages.
    showNote('');
    setBugMessages('', '');
    shareOk('');
    applyLang();
  }
  document.getElementById('langSwitch').addEventListener('click', e => {
    const b = e.target.closest('[data-lang]');
    if (b) setLang(b.dataset.lang);
  });

  // ---------- Start: online when the shared store is available, otherwise one device ----------
  function startLocal() {
    mode = 'local';
    modeHelpKey = onlineSupported() ? 'modeHelpMenu' : 'modeHelpLocalOnly';
    applyLang();
    sync();
    if (homeSupported()) showHome();
  }

  async function startOnline() {
    const c = window.claude;
    let dbNs = null, userNs = null;
    try { [dbNs, userNs] = await Promise.all([c.use('db'), c.use('user')]); } catch (_) { /* fall through */ }
    if (!dbNs) return startLocal();
    db = dbNs; userApi = userNs;
    if (userApi) {
      myId = await userApi.id();
      amOwner = await userApi.isOwner();
      const w = await userApi.can('data.write');
      if (w === false) canWrite = false;
    }
    mode = 'online';
    modeHelpKey = 'modeHelpOnline';
    applyLang();
    if (!myId) showNote(t('loginToPlay'));
    else if (!canWrite) showNote(t('viewOnly'));
    gameRef = db.doc('games/current');
    const subscribe = () => gameRef.onSnapshot(snap => {
      gameExists = snap.exists;
      game = normalize(snap.exists ? snap.data() : null);
      sync();
    }, err => {
      if (err && err.code === 'unavailable') setTimeout(subscribe, 2000);
      else showNote(t('connLost'));
    });
    subscribe();
    sync();
  }

  applyLang();
  if (window.claude && typeof window.claude.use === 'function') startOnline();
  else { startLocal(); openFromLink(); }
  window.addEventListener('hashchange', openFromLink);

  // Exposed for debugging/testing.
  window.cubeTacToe = {
    get game() { return game; }, get mode() { return mode; }, get net() { return net; },
    get tour() { return tour; }, get tourRole() { return tourRole; }, get tourPlayerId() { return tourPlayerId; },
    relay, stickers, placeMark, changeMark, makeMove, newGame, findLines, faceGrids, playMatch, myActiveMatch,
  };
})();
</script>
