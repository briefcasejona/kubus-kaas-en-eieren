<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Boter-kaas-en-eieren op een Rubiks kubus: alleen, met z'n tweeën of in een toernooi.">
<meta name="theme-color" content="#12151e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kubus KEE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<title>Kubus Kaas en Eieren</title>
<style>
  /* Layout: full-screen 3D stage, controls float above it (top: title/status/seats, bottom: move pad). Deliberately one dark look. */
  :root {
    color-scheme: dark;
    --bg1: #2b3245;
    --bg2: #12151e;
    --panel: rgba(20, 24, 34, 0.86);
    --line: #454e66;
    --btn: #2d3447;
    --btn-hover: #3a435b;
    --text: #eef1f7;
    --muted: #9aa3b5;
    --x: #f0565b;
    --o: #4b8ffa;
    --gold: #ffcc33;
    --warn: #ffb4a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg2) radial-gradient(ellipse at center, var(--bg1) 0%, var(--bg2) 75%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    user-select: none;
  }
  #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #stage.can-place { cursor: pointer; }

  #top {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
  }
  #top > * { pointer-events: auto; }
  header { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: .5px; text-wrap: balance; }
  h1 .x { color: var(--x); } h1 .o { color: var(--o); }

  #status {
    background: var(--panel); padding: 9px 18px; border-radius: 999px;
    font-size: 16px; max-width: 100%; text-align: center;
    border: 2px solid transparent; transition: border-color .2s;
  }
  #status.X { border-color: var(--x); }
  #status.O { border-color: var(--o); }
  #status b.X, .X-text { color: var(--x); } #status b.O, .O-text { color: var(--o); }

  #seats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #seats[hidden] { display: none; }
  .seat {
    display: flex; align-items: center; gap: 8px; background: var(--panel);
    border-radius: 999px; padding: 4px 6px 4px 12px; border: 1px solid var(--line);
  }
  .seat .mark { font-weight: 800; font-size: 16px; }
  .seat .who { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat .who.empty { color: var(--muted); font-style: italic; }
  .seat button { padding: 4px 10px; font-size: 13px; border-radius: 999px; }
  .seat.turn { border-color: var(--gold); }

  #p2p { background: var(--panel); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; align-items: center; max-width: 100%; }
  #p2p[hidden], #p2p [hidden] { display: none; }
  .p2p-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
  .p2p-row .or { color: var(--muted); }
  #joinCode {
    font: inherit; font-family: ui-monospace, Consolas, monospace; font-size: 16px; letter-spacing: 3px; text-transform: uppercase;
    width: 8.5em; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg2); color: var(--text); user-select: text;
  }
  #joinCode:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  #p2pText { text-align: center; }
  #p2pText code { font-family: ui-monospace, Consolas, monospace; font-size: 18px; letter-spacing: 3px; color: var(--gold); }

  #note { color: var(--warn); background: var(--panel); border-radius: 10px; padding: 6px 12px; max-width: 520px; text-align: center; }

  button {
    font: inherit; color: var(--text); background: var(--btn); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--btn-hover); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button:disabled { opacity: .35; cursor: not-allowed; }

  #moves {
    position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
    background: var(--panel); padding: 10px; border-radius: 14px;
    display: grid; grid-template-columns: repeat(9, auto); gap: 6px;
    transition: box-shadow .2s;
  }
  #moves.active { box-shadow: 0 0 0 2px var(--gold); }
  #moves button { min-width: 48px; font-weight: 600; font-size: 16px; }
  #moves button.slice { background: #252b3b; border-style: dashed; border-color: rgba(255, 204, 51, .6); color: var(--gold); }
  #moves .hint { grid-column: 1 / -1; text-align: center; font-size: 12px; color: var(--muted); }

  #log {
    position: fixed; right: 16px; top: 150px; width: 150px; max-height: 45vh; overflow-y: auto;
    background: var(--panel); border-radius: 10px; padding: 8px 10px; font-size: 13px;
  }
  #log h2 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  #log ol { margin: 0; padding-left: 22px; }
  #log .X { color: var(--x); } #log .O { color: var(--o); }

  #help {
    position: fixed; left: 16px; top: 150px; width: 220px;
    background: var(--panel); border-radius: 10px; padding: 8px 12px; font-size: 13px; color: var(--muted);
    line-height: 1.45;
  }
  #help b { color: var(--text); }

  #banner {
    position: fixed; left: 0; right: 0; top: 42%; display: flex; justify-content: center;
    pointer-events: none; padding: 0 16px;
  }
  #banner[hidden] { display: none; }
  #banner div {
    pointer-events: auto; background: var(--panel); border: 2px solid var(--gold);
    padding: 16px 26px; border-radius: 16px; text-align: center;
  }
  #banner h2 { margin: 0 0 8px; font-size: 26px; }

  .head-actions { display: flex; gap: 8px; flex-shrink: 0; }
  #tourBtn.ready { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 0 2px rgba(255, 204, 51, .35); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(255, 204, 51, 0); } }
  button.primary { background: #4a3d10; border-color: var(--gold); color: #fff3cf; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #5d4c14; }

  /* Tournament panel: a full-screen sheet over the cube */
  #tourPanel {
    position: fixed; inset: 0; z-index: 20; overflow-y: auto; background: rgba(10, 12, 18, .94);
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
    user-select: text;
  }
  #tourPanel[hidden] { display: none; }
  .tp-wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .tp-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .tp-head h2 { margin: 0; font-size: 22px; text-wrap: balance; }
  .tp-head .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .tp-wrap code { font-family: ui-monospace, Consolas, monospace; letter-spacing: 3px; color: var(--gold); }
  .tp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .tp-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .tp-card h3 { margin: 0; font-size: 16px; }
  .tp-card p { margin: 0; color: var(--muted); line-height: 1.45; }
  .tp-card label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 13px; }
  .tp-card label.chk { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 14px; }
  .tp-card textarea { resize: vertical; min-height: 4.5em; line-height: 1.4; }
  .tp-card input[type="text"], .tp-card select, .tp-card textarea {
    font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg2); color: var(--text);
  }
  .tp-card input:focus-visible, .tp-card select:focus-visible, .tp-card textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }

  /* Home screen: the menu over a dimmed view of the cube */
  #home {
    position: fixed; inset: 0; z-index: 15; overflow-y: auto; background: rgba(10, 12, 18, .8);
    padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  #home[hidden], #home [hidden] { display: none; }
  /* While the menu is open only the cube stays visible behind it */
  body.home-open #top, body.home-open #moves, body.home-open #help, body.home-open #log, body.home-open #banner, body.home-open #chat { visibility: hidden; }
  .home-wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .home-title { margin: 8px 0 0; font-size: clamp(28px, 7vw, 44px); letter-spacing: .5px; text-align: center; text-wrap: balance; }
  .home-title .x { color: var(--x); } .home-title .o { color: var(--o); }
  .home-sub { margin: 0; text-align: center; color: var(--muted); }
  .home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
  .home-card .row { display: flex; gap: 8px; }
  .home-card .row input { flex: 1; min-width: 0; font-family: ui-monospace, Consolas, monospace; letter-spacing: 3px; text-transform: uppercase; }
  .home-card .or { color: var(--muted); font-size: 13px; text-align: center; }
  .home-actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .home-rules ol { margin: 0; padding-left: 20px; color: var(--muted); line-height: 1.55; display: flex; flex-direction: column; gap: 6px; }
  .home-rules b { color: var(--text); }
  .home-top { display: flex; justify-content: flex-end; }
  .lang-switch { display: flex; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
  .lang-switch button { display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 6px; border-radius: 999px; border-color: transparent; background: transparent; font-size: 13px; font-weight: 600; color: var(--muted); }
  .lang-switch button svg { width: 24px; height: 16px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .25); flex-shrink: 0; display: block; }
  .lang-switch button[aria-pressed="true"] { background: var(--btn); border-color: var(--gold); color: var(--text); }
  .share-card { align-items: flex-start; }
  .qr { background: #fff; border-radius: 12px; padding: 12px; width: min(240px, 100%); aspect-ratio: 1; display: grid; place-items: center; color: #12151e; }
  .qr svg { width: 100%; height: auto; display: block; }
  .share-link { margin: 0; font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: var(--text); overflow-wrap: anywhere; user-select: text; }
  .ok-note { color: #a8e6b4; margin: 0; }
  .ok-note:empty { display: none; }
  #tCode { font-family: ui-monospace, Consolas, monospace; letter-spacing: 3px; text-transform: uppercase; }
  .tp-note { color: var(--warn); margin: 0; }
  .tp-note:empty { display: none; }
  .tp-me { border-color: var(--gold); }
  .tp-me .big { font-size: 18px; color: var(--text); }
  .players { display: flex; flex-wrap: wrap; gap: 6px; }
  .players span { background: var(--btn); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  .players span.me { border-color: var(--gold); }
  .champion { text-align: center; font-size: 24px; font-weight: 700; color: var(--gold); padding: 6px 0; }
  .bracket-scroll { overflow-x: auto; padding-bottom: 6px; }
  .bracket { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(170px, 1fr); gap: 14px; min-width: min-content; }
  .round { display: flex; flex-direction: column; gap: 10px; }
  .round h4 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .round .matches { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 10px; }
  .match { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .match.live { border-color: var(--gold); }
  .slot { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; white-space: nowrap; }
  .slot + .slot { border-top: 1px solid var(--line); }
  .slot .nm { overflow: hidden; text-overflow: ellipsis; }
  .slot .side { color: var(--muted); font-size: 12px; }
  .slot.win .nm { font-weight: 700; color: var(--gold); }
  .slot.lose .nm { color: var(--muted); text-decoration: line-through; }
  .slot.empty .nm { color: var(--muted); font-style: italic; }
  .slot.me .nm::after { content: attr(data-you); color: var(--muted); font-weight: 400; }
  #moves[hidden] { display: none; }

  /* Match chat: open for spectators, a quiet closed button for the two players */
  #chat { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 5; max-width: calc(100vw - 32px); }
  #chat[hidden], #chat [hidden] { display: none; }
  .chat-toggle { background: var(--panel); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
  .chat-badge { background: var(--gold); color: #1b1f2b; border-radius: 999px; padding: 1px 7px; font-size: 12px; font-weight: 700; margin-left: 4px; }
  .chat-panel { width: 290px; max-width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .chat-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
  .chat-head button { padding: 0 8px; font-size: 18px; line-height: 1.4; }
  #chatList { list-style: none; margin: 0; padding: 0; max-height: min(34vh, 260px); overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 13px; user-select: text; }
  #chatList li { overflow-wrap: anywhere; line-height: 1.35; }
  #chatList li b { color: var(--gold); margin-right: 4px; }
  #chatList li.mine b { color: var(--o); }
  .chat-form { display: flex; gap: 6px; }
  .chat-form input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); user-select: text; }
  .chat-form input:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .chat-form button { padding: 6px 10px; }
  .chat-note { margin: 0; font-size: 12px; color: var(--muted); }
  .chat-note:empty { display: none; }
  body.chat-open #help { display: none; }

  .match .watch-btn { margin: 0 10px 8px; padding: 4px 12px; font-size: 13px; border-color: var(--gold); color: var(--gold); }
  .match .tag { font-size: 11px; color: var(--muted); padding: 0 10px 6px; }

  @media (max-width: 760px) {
    #log, #help { display: none; }
    h1 .x, h1 .o, h1 .dot { display: none; }
    .head-actions button { padding: 6px 10px; }
    #moves { width: calc(100vw - 32px); grid-template-columns: repeat(9, minmax(0, 1fr)); padding: 8px; gap: 4px; }
    #moves button { min-width: 0; padding: 7px 0; font-size: 14px; }
    #status { font-size: 14px; }
    h1 { font-size: 17px; }
  }
  @media (prefers-reduced-motion: reduce) { #status, #moves { transition: none; } #tourBtn.ready { animation: none; } }
</style>

<div id="stage"></div>

<div id="top">
  <header>
    <h1>Kubus Kaas en Eieren <span class="x">X</span><span class="dot">·</span><span class="o">O</span></h1>
    <div class="head-actions">
      <button type="button" id="menuBtn" hidden data-i18n="menu">Menu</button>
      <button type="button" id="tourBtn" hidden>Toernooi</button>
      <button type="button" id="newGame" data-i18n="newGame">Nieuw spel</button>
    </div>
  </header>
  <div id="status" data-i18n="loading">Laden…</div>
  <div id="seats" hidden>
    <div class="seat" id="seatX"><span class="mark X-text">X</span><span class="who"></span><button type="button"></button></div>
    <div class="seat" id="seatO"><span class="mark O-text">O</span><span class="who"></span><button type="button"></button></div>
  </div>
  <div id="p2p" hidden>
    <div class="p2p-row" id="p2pStart">
      <button type="button" id="hostBtn" data-i18n="hostOnline">Online spel starten</button>
      <span class="or" data-i18n="or">of</span>
      <input id="joinCode" maxlength="6" placeholder="CODE" autocomplete="off" spellcheck="false" aria-label="Spelcode van je tegenstander" data-i18n-aria="joinCodeAria">
      <button type="button" id="joinBtn" data-i18n="join">Meedoen</button>
      <button type="button" id="installBtn" hidden data-i18n="install">App installeren</button>
    </div>
    <div class="p2p-row" id="p2pInfo" hidden>
      <span id="p2pText"></span>
      <button type="button" id="copyCode" hidden data-i18n="copyCode">Kopieer code</button>
      <button type="button" id="shareLink" hidden data-i18n="shareLinkBtn">Deel link</button>
      <button type="button" id="openSchedule" hidden data-i18n="schedule">Schema</button>
      <button type="button" id="leaveP2P" data-i18n="stop">Stoppen</button>
    </div>
  </div>
  <div id="note" hidden></div>
</div>

<aside id="help">
  <span data-i18n-html="helpHtml"></span>
  <span id="modeHelp"></span>
</aside>

<aside id="log"><h2 data-i18n="movesLog">Zetten</h2><ol id="logList"></ol></aside>

<div id="moves"></div>

<div id="chat" hidden>
  <button type="button" id="chatToggle" class="chat-toggle"><span data-i18n="chat">Chat</span> <span id="chatBadge" class="chat-badge" hidden></span></button>
  <div id="chatPanel" class="chat-panel" hidden>
    <div class="chat-head"><b data-i18n="spectatorChat"></b><button type="button" id="chatClose" data-i18n-aria="chatClose">×</button></div>
    <ol id="chatList" aria-live="polite"></ol>
    <p id="chatEmpty" class="chat-note" data-i18n="chatEmpty"></p>
    <form id="chatForm" class="chat-form" autocomplete="off">
      <input type="text" id="chatInput" maxlength="200" data-i18n-ph="chatPh" data-i18n-aria="chatPh">
      <button type="submit" class="primary" data-i18n="send"></button>
    </form>
    <p id="chatNote" class="chat-note"></p>
  </div>
</div>

<div id="banner" hidden><div><h2 id="bannerText"></h2><button id="bannerNew" data-i18n="playAgain">Opnieuw spelen</button></div></div>

<div id="tourPanel" hidden><div class="tp-wrap" id="tourBody"></div></div>

<div id="home" hidden>
  <div class="home-wrap">
    <div class="home-top">
      <div id="langSwitch" class="lang-switch" role="group" aria-label="Taal / Language / Sprache">
        <button type="button" data-lang="nl" aria-label="Nederlands" title="Nederlands">
          <svg viewBox="0 0 9 6" aria-hidden="true"><rect width="9" height="2" fill="#AE1C28"/><rect y="2" width="9" height="2" fill="#FFFFFF"/><rect y="4" width="9" height="2" fill="#21468B"/></svg><span>NL</span>
        </button>
        <button type="button" data-lang="en" aria-label="English" title="English">
          <svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <clipPath id="ukClip"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
            <rect width="60" height="30" fill="#012169"/>
            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#FFFFFF" stroke-width="6"/>
            <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ukClip)" stroke="#C8102E" stroke-width="4"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#FFFFFF" stroke-width="10"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
          </svg><span>EN</span>
        </button>
        <button type="button" data-lang="de" aria-label="Deutsch" title="Deutsch">
          <svg viewBox="0 0 5 3" aria-hidden="true"><rect width="5" height="1" fill="#000000"/><rect y="1" width="5" height="1" fill="#DD0000"/><rect y="2" width="5" height="1" fill="#FFCE00"/></svg><span>DE</span>
        </button>
      </div>
    </div>
    <h1 class="home-title">Kubus Kaas en Eieren <span class="x">X</span><span class="dot">·</span><span class="o">O</span></h1>
    <p class="home-sub" data-i18n="subtitle"></p>
    <p class="tp-note" id="homeNote"></p>

    <div id="homeMain" class="home-grid">
      <section class="tp-card home-card">
        <h3 data-i18n="localTitle"></h3>
        <p data-i18n="localDesc"></p>
        <button type="button" class="primary" id="hLocal" data-i18n="play"></button>
      </section>
      <section class="tp-card home-card" id="hOnlineCard">
        <h3 data-i18n="onlineTitle"></h3>
        <p data-i18n="onlineDesc"></p>
        <button type="button" class="primary" id="hHost" data-i18n="startGame"></button>
        <span class="or" data-i18n="orJoinCode"></span>
        <div class="row">
          <input type="text" id="hCode" maxlength="6" placeholder="CODE" autocomplete="off" spellcheck="false" data-i18n-aria="codeAria">
          <button type="button" id="hJoin" data-i18n="join"></button>
        </div>
      </section>
